[project]
name = "arcadify-shell-gtk"
version = "0.1.0"
description = "GTK3 prototype Arcadify maintenance launcher"
requires-python = ">=3.9"

[project.scripts]
arcadify-shell-gtk = "arcadify_shell_gtk.app:main"

[tool.arcadify.system-dependencies]
debian = ["python3", "python3-gi", "gir1.2-gtk-3.0", "gir1.2-gdkpixbuf-2.0"]
ubuntu = ["python3", "python3-gi", "gir1.2-gtk-3.0", "gir1.2-gdkpixbuf-2.0"]
